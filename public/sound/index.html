<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="TinyGrapeLab 免费声浪实验室。跑车、拖拉机与喷气机，随速度和加速度实时变化。">
  <title>声浪实验室 · TinyGrapeLab</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js?v=2" type="module"></script>
</head>
<body>
  <div class="app" id="app" data-vehicle="car">
    <header class="topbar">
      <a class="brand" href="/zh/" aria-label="TinyGrapeLab 首页"><span class="brand-mark">TG</span><span>TinyGrapeLab</span></a>
      <div class="top-actions"><div class="live" id="live"><i></i><span>检测中</span></div><a class="explore" href="/zh/products/">探索更多好玩 <span aria-hidden="true">↗</span></a></div>
    </header>
    <main class="main">
      <section class="stage" aria-label="当前载具仪表">
        <div class="stage-heading"><div><p class="eyebrow" id="type">V8 · SPORTS CAR</p><h1 id="name">V8 运动跑车</h1></div><span class="source" id="source">等待数据</span></div>
        <div class="scene scene-car" aria-label="跑车仪表盘">
          <div class="gauges"><div class="gauge speed-gauge"><div class="gauge-inner"><strong id="car-speed">0</strong><small>km/h · 速度</small></div></div><div class="gauge rpm-gauge"><div class="gauge-inner"><strong id="car-rpm">850</strong><small>rpm · 虚拟转速</small></div></div></div>
          <div class="scene-details"><span id="car-gear">D1 · 虚拟挡位</span><span id="car-load">负载 0%</span></div>
        </div>
        <div class="scene scene-tractor" aria-label="拖拉机柴油发动机">
          <div class="tractor-engine" aria-hidden="true"><div class="tractor-tank"></div><div class="tractor-block"></div><div class="tractor-flywheel"><div></div></div><div class="tractor-exhaust"></div></div>
          <div class="scene-details"><span><strong id="tractor-rpm">720</strong> rpm · 柴油机</span><span><strong id="tractor-speed">0</strong> km/h</span></div>
        </div>
        <div class="scene scene-jet" aria-label="喷气机座舱仪表">
          <div class="jet-display"><div class="jet-horizon"><span>✦</span></div><div class="jet-readouts"><div><small>虚拟推力</small><strong id="jet-thrust">28%</strong></div><div><small>地速</small><strong id="jet-speed">0</strong><small>km/h</small></div></div></div>
          <div class="scene-details"><span>涡轮与喷流 · 娱乐模拟</span><span id="jet-load">负载 0%</span></div>
        </div>
        <div class="stage-footer"><span id="audio-status">正在准备声音…</span><span>速度＋加速度 → 连续声浪</span></div>
      </section>
      <section class="controls" aria-label="声音与试音控制">
        <label class="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="55" aria-label="声浪音量"><output id="volume-value">55%</output></label>
        <button type="button" id="manual-toggle" class="manual-toggle" aria-pressed="false">手动试音</button>
        <div class="manual-panel" id="manual-panel" hidden><p>停车时试音 · 按住油门或刹车</p><div class="pedals"><button id="brake" class="pedal" type="button">刹车</button><button id="gas" class="pedal gas" type="button">按住油门</button></div></div>
      </section>
      <section class="garage" aria-label="选择载具"><div class="garage-heading"><strong>选择载具</strong><span>左右滑动</span></div><div class="vehicle-list">
        <button type="button" class="vehicle-card" data-kind="car" aria-pressed="true"><span class="card-kind">汽车 / V8</span><strong>运动跑车</strong><small>仪表 · 换挡 · 排气</small></button>
        <button type="button" class="vehicle-card" data-kind="tractor" aria-pressed="false"><span class="card-kind">农机 / DIESEL</span><strong>手扶拖拉机</strong><small>飞轮 · 单缸柴油</small></button>
        <button type="button" class="vehicle-card" data-kind="jet" aria-pressed="false"><span class="card-kind">航空 / JET</span><strong>喷气战斗机</strong><small>座舱 · 涡轮喷流</small></button>
      </div></section>
      <p class="footnote">免费声浪实验原型 · 声音和仪表为模拟效果。请停车设置，驾驶时勿操作屏幕，音量以能听清交通提示为准。</p>
    </main>
  </div>
</body>
</html>
